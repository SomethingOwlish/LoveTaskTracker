# Приложение переехало на Cloudflare Workers (см. wrangler.jsonc).
# GitHub Pages теперь отдаёт только страницу-редирект на новый адрес
# и «самоудаляющийся» service worker для тех, у кого закэширована старая версия.
name: GitHub Pages redirect

on:
  push:
    branches: ["main"]
    paths: ["pages-redirect/**", ".github/workflows/pages-redirect.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'pages-redirect'
      - id: deployment
        uses: actions/deploy-pages@v5
