# Тесты и сборка на каждый PR и пуш в main.
# Деплой делает Cloudflare Workers Builds (см. README), этот workflow только проверяет.
name: CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
